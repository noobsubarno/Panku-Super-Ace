<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag forces perfect mobile scaling and prevents accidental zooming -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panku-Super-Ace</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            color: white;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation; /* Prevents double-tap zoom on phones */
        }

        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        #game-title {
            font-size: 45px; /* Shrunk for mobile */
            color: #f1c40f;
            text-shadow: 0 0 20px #e67e22;
            margin-bottom: 30px;
            text-align: center;
        }
        #play-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(180deg, #f1c40f, #d35400);
            color: white;
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.5);
        }
        #play-btn:active { transform: scale(0.95); }

        #game-ui {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px; /* Constrain to phone width */
        }
        
        /* Mobile HUD layout */
        #hud-container {
            display: flex;
            flex-wrap: wrap; /* Allows text to drop to the next line on small screens */
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
            font-size: 14px; /* Shrunk for mobile */
            background: #111;
            padding: 10px 15px;
            border-radius: 10px;
            border: 2px solid #444;
            width: 90%;
            box-sizing: border-box;
        }
        #multiplier-display { color: #f1c40f; }
        #win-display { color: #2ecc71; }
        
        /* Mobile Control Panel */
        #control-panel {
            display: flex;
            flex-direction: column; /* Stack vertically for phone */
            gap: 10px;
            margin-top: 15px;
            width: 90%;
            align-items: center;
        }
        #bet-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid #555;
            width: 100%;
            box-sizing: border-box;
        }
        .bet-btn {
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .bet-btn:active { background: #555; }
        #bet-display {
            font-size: 18px;
            color: #f1c40f;
        }

        #spin-btn {
            padding: 15px;
            font-size: 22px;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        #spin-btn:active { transform: scale(0.98); }
    </style>
    <script src="https://pixijs.download/v8.1.0/pixi.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <div id="game-title">PANKU<br>SUPER ACE</div>
        <button id="play-btn">START GAME</button>
    </div>

    <div id="game-ui">
        <div id="hud-container">
            <div id="balance-display">Balance: $1000.00</div>
            <div id="multiplier-display">Multiplier: x1</div>
            <div id="win-display">Win: $0.00</div>
            <div id="freespin-display" style="color: #e74c3c; display: none; width: 100%; text-align: center;">Free Spins: 0</div>
        </div>
        
        <!-- Game Canvas inserts here -->
        <div id="game-container"></div>
        
        <div id="control-panel">
            <div id="bet-selector">
                <button class="bet-btn" id="bet-minus">-</button>
                <div id="bet-display">Bet: $10</div>
                <button class="bet-btn" id="bet-plus">+</button>
            </div>
            <button id="spin-btn">SPIN REELS</button>
        </div>
    </div>

    <!-- Forcing browser cache refresh -->
    <script defer src="game.js?v=1000"></script>
</body>
</html>
