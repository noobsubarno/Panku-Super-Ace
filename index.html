<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Ace Clone Engine</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        #hud-container {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: bold;
            background: #222;
            padding: 10px 25px;
            border-radius: 30px;
            border: 1px solid #333;
        }
        #multiplier-display { color: #f1c40f; }
        #win-display { color: #2ecc71; }
        
        button {
            margin-top: 20px;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(180deg, #f39c12, #d35400);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.98); }
    </style>
    <script src="https://pixijs.download/v8.1.0/pixi.min.js"></script>
</head>
<body>

    <div id="hud-container">
        <div id="balance-display">Balance: $1000.00</div>
        <div id="multiplier-display">Multiplier: x1</div>
        <div id="win-display">Win: $0.00</div>
    </div>

    <div id="game-container"></div>
    <button id="spin-btn">SPIN REELS</button>

    <script defer src="game.js"></script>
</body>
</html>
