<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panku-Super-Ace</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            color: white;
            user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        #game-title {
            font-size: 45px;
            color: #f1c40f;
            text-shadow: 0 0 20px #e67e22;
            margin-bottom: 30px;
            text-align: center;
        }
        #play-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(180deg, #f1c40f, #d35400);
            color: white;
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.5);
        }
        #play-btn:active { transform: scale(0.95); }

        #game-ui {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        
        /* --- NEW MULTIPLIER BAR --- */
        #multiplier-bar {
            display: flex;
            width: 95%;
            background: #111;
            border-radius: 20px;
            border: 2px solid #333;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .multi-step {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 16px;
            color: #555;
            background: #111;
            transition: all 0.3s ease;
            border-right: 1px solid #333;
        }
        .multi-step:last-child { border-right: none; }
        
        /* Active Glowing Multiplier Step */
        .multi-step.active {
            background: linear-gradient(180deg, #f1c40f, #d35400);
            color: white;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.8);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.3);
        }

        #hud-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 15px;
            background: #1a1a1a;
            padding: 10px 20px;
            border-radius: 10px;
            width: 95%;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        #balance-display { color: #fff; }
        #win-display { color: #2ecc71; font-weight: bold; }
        
        #control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            width: 95%;
            align-items: center;
        }
        #bet-selector {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid #444;
            width: 100%;
            box-sizing: border-box;
        }
        .bet-btn {
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            background: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .bet-btn:active { background: #555; }
        #bet-display {
            font-size: 18px;
            color: #f1c40f;
        }

        #spin-btn {
            padding: 15px;
            font-size: 22px;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            text-transform: uppercase;
        }
        #spin-btn:active { transform: scale(0.98); }
    </style>
    <script src="https://pixijs.download/v8.1.0/pixi.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <div id="game-title">PANKU<br>SUPER ACE</div>
        <button id="play-btn">START GAME</button>
    </div>

    <div id="game-ui">
        
        <div id="multiplier-bar">
            <div class="multi-step active" id="multi-0">x1</div>
            <div class="multi-step" id="multi-1">x2</div>
            <div class="multi-step" id="multi-2">x3</div>
            <div class="multi-step" id="multi-3">x5</div>
        </div>

        <div id="hud-container">
            <div id="balance-display">Balance: $1000.00</div>
            <div id="win-display">Win: $0.00</div>
            <div id="freespin-display" style="color: #e74c3c; display: none; width: 100%; text-align: center;">Free Spins: 0</div>
        </div>
        
        <div id="game-container"></div>
        
        <div id="control-panel">
            <div id="bet-selector">
                <button class="bet-btn" id="bet-minus">-</button>
                <div id="bet-display">Bet: $10</div>
                <button class="bet-btn" id="bet-plus">+</button>
            </div>
            <button id="spin-btn">SPIN REELS</button>
        </div>
    </div>

    <script defer src="game.js?v=2000"></script>
</body>
</html>
