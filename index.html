<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panku-Super-Ace</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            color: white;
            user-select: none;
            overflow: hidden;
        }

        /* --- START SCREEN STYLING --- */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        #game-title {
            font-size: 60px;
            color: #f1c40f;
            text-shadow: 0 0 20px #e67e22;
            margin-bottom: 40px;
            text-align: center;
        }
        #play-btn {
            padding: 20px 60px;
            font-size: 30px;
            font-weight: bold;
            background: linear-gradient(180deg, #f1c40f, #d35400);
            color: white;
            border: 4px solid #fff;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(241, 196, 15, 0.5);
            transition: transform 0.1s;
        }
        #play-btn:active { transform: scale(0.95); }

        /* --- GAME UI STYLING --- */
        #game-ui {
            display: none; /* Hidden until start screen clears */
            flex-direction: column;
            align-items: center;
        }
        #hud-container {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
            font-size: 20px;
            background: #111;
            padding: 15px 30px;
            border-radius: 10px;
            border: 2px solid #444;
        }
        #multiplier-display { color: #f1c40f; }
        #win-display { color: #2ecc71; }
        
        #spin-btn {
            margin-top: 20px;
            padding: 15px 50px;
            font-size: 24px;
            background: linear-gradient(180deg, #2ecc71, #27ae60);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #spin-btn:active { transform: scale(0.98); }
    </style>
    <script src="https://pixijs.download/v8.1.0/pixi.min.js"></script>
</head>
<body>

    <div id="start-screen">
        <div id="game-title">PANKU<br>SUPER ACE</div>
        <button id="play-btn">START GAME</button>
    </div>

    <div id="game-ui">
        <div id="hud-container">
            <div id="balance-display">Balance: $1000.00</div>
            <div id="multiplier-display">Multiplier: x1</div>
            <div id="win-display">Win: $0.00</div>
        </div>
        <div id="game-container"></div>
        <button id="spin-btn">SPIN REELS ($10)</button>
    </div>

    <script defer src="game.js?v=3"></script>
</body>
</html>
